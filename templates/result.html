<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
</head>

<body style="font-family: Arial; background:#f5f5f5; text-align:center;">

    <div style="width:60%; margin:50px auto; background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px gray;">

        <h2>Your Answer</h2>
        <div style="text-align:left; background:#f9f9f9; padding:10px; border-radius:5px;">
    <b>Your Answer:</b>
    <p>{{ answer }}</p>
</div>

        <h2>Feedback</h2>
        <div style="text-align:left; background:#eef; padding:10px; border-radius:5px;">
    <b>AI Feedback:</b>
    <pre>{{ feedback }}</pre>

    <h3 style="color:green;">Your Score So Far: {{ total }}</h3>
</div>

        <br>

        <!-- Next Question -->
        <form action="/interview" method="post">
            <input type="hidden" name="q_index" value="{{ next_q }}">
            <input type="hidden" name="total" value="{{ total }}">
            <button type="submit" style="padding:10px; background:#4CAF50; color:white; border:none; border-radius:5px;">
                Next Question
            </button>
        </form>

    </div>

</body>
</html>
