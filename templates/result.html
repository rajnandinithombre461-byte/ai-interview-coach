<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
</head>

<body style="font-family: Arial; background:#f5f5f5; text-align:center;">

    <div style="width:60%; margin:50px auto; background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px gray;">

        <h2>Your Answer</h2>
        <p>{{ answer }}</p>

        <h2>Feedback</h2>
        <pre>{{ feedback }}</pre>

        <br>

        <a href="/interview?q={{ next_q }}&total={{ total }}">
            <button style="padding:10px; background:#4CAF50; color:white; border:none; border-radius:5px;">
                Next Question
            </button>
        </a>

    </div>

</body>
</html>
